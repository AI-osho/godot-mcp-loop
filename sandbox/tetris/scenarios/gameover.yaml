# Stack pieces until the next one cannot spawn -> game over; R restarts to the initial state.
# Fixed order (test_gameover.tscn): only O pieces, no gravity.
# First earn some score (5 O side by side -> 2 lines, 300) so the restart has something to reset.
# Then 10 O dropped in the middle fill columns 4-5 all 20 rows -> the 16th spawn collides.
name: tetris game over and restart
scene: res://sandbox/tetris/test_gameover.tscn
steps:
  - wait_for: { node: Game, property: piece_type, op: "==", value: "O", timeout_ms: 3000 }
  - input:
      - { key: Left, hold_ms: 30, wait_ms: 30 }
      - { key: Left, hold_ms: 30, wait_ms: 30 }
      - { key: Left, hold_ms: 30, wait_ms: 30 }
      - { key: Left, hold_ms: 30, wait_ms: 30 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Left, hold_ms: 30, wait_ms: 30 }
      - { key: Left, hold_ms: 30, wait_ms: 30 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Right, hold_ms: 30, wait_ms: 30 }
      - { key: Right, hold_ms: 30, wait_ms: 30 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Right, hold_ms: 30, wait_ms: 30 }
      - { key: Right, hold_ms: 30, wait_ms: 30 }
      - { key: Right, hold_ms: 30, wait_ms: 30 }
      - { key: Right, hold_ms: 30, wait_ms: 30 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
  - assert: { node: Game, property: score, op: "==", value: 300 }
  - assert: { node: Game, property: filled_count, op: "==", value: 0 }
  # Nine O in the middle: 18 rows high, still alive
  - input:
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
      - { key: Space, hold_ms: 30, wait_ms: 50 }
  - assert: { node: Game, property: filled_count, op: "==", value: 36 }
  - assert: { node: Game, property: game_over, op: "==", value: false }
  # Tenth O reaches the top row -> the next O cannot spawn
  - input:
      - { key: Space, hold_ms: 30, wait_ms: 50 }
  - wait_for: { node: Game, property: game_over, op: "==", value: true, timeout_ms: 1000 }
  - assert: { node: Game, property: filled_count, op: "==", value: 40 }
  - assert: { node: Game, property: pieces_spawned, op: "==", value: 16 }
  - assert: { node: Game/GameOverLabel, property: visible, op: "==", value: true }
  - screenshot: game_over
  # Input is ignored while game over
  - input: [{ key: Left, hold_ms: 30, wait_ms: 30 }, { key: Space, hold_ms: 30, wait_ms: 50 }]
  - assert: { node: Game, property: filled_count, op: "==", value: 40 }
  - assert: { node: Game, property: score, op: "==", value: 300 }
  # Restart
  - input: { key: R, hold_ms: 30, wait_ms: 50 }
  - assert: { node: Game, property: game_over, op: "==", value: false }
  - assert: { node: Game, property: score, op: "==", value: 0 }
  - assert: { node: Game, property: lines, op: "==", value: 0 }
  - assert: { node: Game, property: level, op: "==", value: 1 }
  - assert: { node: Game, property: filled_count, op: "==", value: 0 }
  - assert: { node: Game, property: stack_text, op: "==", value: "" }
  - assert: { node: Game, property: pieces_spawned, op: "==", value: 1 }
  - assert: { node: Game, property: piece_cells, op: "==", value: "4,0 5,0 4,1 5,1" }
  - assert: { node: Game, property: fall_interval, op: "==", value: 0.8 }
  - assert: { node: Game/GameOverLabel, property: visible, op: "==", value: false }
  - assert: { node: Game/ScoreLabel, property: text, op: "==", value: "SCORE\n0" }
  # The game is playable again
  - input: { key: Space, hold_ms: 30, wait_ms: 50 }
  - assert: { node: Game, property: stack_text, op: "==", value: "....OO....|....OO...." }
  - screenshot: after_restart
  - assert_no_errors: true
