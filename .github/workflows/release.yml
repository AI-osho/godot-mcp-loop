name: Release

# Pushing a tag vX.Y.Z (after the release PR that set the versions and the CHANGELOG section was merged) builds the
# artifacts, creates the GitHub release with them, and stages the same npm tarball with trusted publishing (OIDC, no
# token). A maintainer then approves the staged package with 2FA: `npm stage approve <id>` or npmjs.com ›
# godot-mcp-loop › Staged Packages. See docs/releasing.md. Run it by hand (workflow_dispatch) for a dry run that only
# builds and checks.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and check without publishing (X.Y.Z, must match server/package.json)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Version from the tag (or the input)
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then v="${TAG#v}"; else v="$INPUT_VERSION"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Not a version: $v" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Type check and unit tests
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Artifacts (versions checked, tarball contents checked)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-artifacts.sh "$VERSION" release

      - name: npm dry run of the exact tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm publish "release/godot-mcp-loop-$VERSION.tgz" --dry-run --access public

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$TAG" --notes-file release/release-notes.md \
            "release/godot-mcp-loop-addon-$VERSION.zip" "release/godot-mcp-loop-$VERSION.tgz" release/SHA256SUMS.txt

  npm:
    name: Stage on npm (approve with 2FA)
    needs: [build, github-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing: npm exchanges the workflow's OIDC token, no stored secret
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: npm with staged publishing
        run: npm install -g npm@latest && npm --version

      - name: Stage the tarball that is attached to the GitHub release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd release && sha256sum -c SHA256SUMS.txt)
          npm stage publish "release/godot-mcp-loop-$VERSION.tgz" --access public
          echo "Staged godot-mcp-loop@$VERSION. Approve it with 2FA: npm stage list godot-mcp-loop, then npm stage approve <id>" >> "$GITHUB_STEP_SUMMARY"
